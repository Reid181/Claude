<title>Beach Camp Program</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&display=swap">
<style id="app-style">
/* Layout: ocean header band with a sand tide-line, sticky day tabs, then a time-scaled timetable (all days) or a single-day timeline. */
:root{
  --bg:#F1F5F5; --surface:#FFFFFF; --surface-2:#E6EEEE; --ink:#0F252D; --ink-2:#4E646B; --line:#D2DEDE; --grid:#E4ECEC;
  --sea:#0C4A5C; --sea-2:#0E5A6F; --sea-ink:#E9F6F7; --accent:#0A7387; --accent-ink:#FFFFFF;
  --sand:#E8C47E; --sand-ink:#2B1F07; --now:#DE4636; --danger:#B42318; --focus:#0A7387;
  --bk-bg-l:.935; --bk-bd-l:.82; --bk-tx-l:.31; --bk-chroma:.62;
  --font-display:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --axis-w:60px; --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1417; --surface:#121D21; --surface-2:#192830; --ink:#E3EEEF; --ink-2:#97ADB2; --line:#253840; --grid:#1B2A30;
  --sea:#0A2D38; --sea-2:#0D3845; --sea-ink:#DDF0F2; --accent:#4CC2D5; --accent-ink:#04222A;
  --sand:#D2AE68; --sand-ink:#211704; --now:#FF6A5C; --danger:#FF8B7E; --focus:#4CC2D5;
  --bk-bg-l:.34; --bk-bd-l:.5; --bk-tx-l:.94; --bk-chroma:.75; --sand-mix:16%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1417; --surface:#121D21; --surface-2:#192830; --ink:#E3EEEF; --ink-2:#97ADB2; --line:#253840; --grid:#1B2A30;
  --sea:#0A2D38; --sea-2:#0D3845; --sea-ink:#DDF0F2; --accent:#4CC2D5; --accent-ink:#04222A;
  --sand:#D2AE68; --sand-ink:#211704; --now:#FF6A5C; --danger:#FF8B7E; --focus:#4CC2D5;
  --bk-bg-l:.34; --bk-bd-l:.5; --bk-tx-l:.94; --bk-chroma:.75; --sand-mix:16%; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Header */
.top{background:var(--sea);color:var(--sea-ink);border-bottom:5px solid var(--sand);position:relative}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-block:22px 18px}
.brand{min-width:0;flex:1 1 320px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.86}
.top h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(30px,5.2vw,50px);line-height:1;letter-spacing:-.02em;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;padding:0;list-style:none;font-size:14px;opacity:.92}
.facts li{display:flex;align-items:center;gap:6px}
.facts .ico{width:15px;height:15px;opacity:.8}
.example-tag{display:inline-block;margin-left:8px;vertical-align:middle;font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--sand);color:var(--sand-ink);padding:3px 8px;border-radius:6px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.icon{width:42px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24);color:var(--sea-ink)}
.top .btn:hover{background:rgba(255,255,255,.18)}
.top .btn.sand{background:var(--sand);border-color:var(--sand);color:var(--sand-ink)}
.status{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:0 4px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--sand)}
.status.ok .dot{background:#5FD39A}

/* Notice + draft banner */
.banners{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.banners:empty{display:none}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:color-mix(in oklab,var(--sand) var(--sand-mix,30%),var(--surface));border:1px solid color-mix(in oklab,var(--sand) 55%,var(--surface));font-size:14px}
.notice b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px;white-space:nowrap}
.notice .grow{flex:1;min-width:0}
.notice .btn{min-height:34px;font-size:13px}

/* Day tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px;scroll-padding-inline:16px}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:84px;max-width:170px;padding:7px 12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;position:relative;transition:background .18s,color .18s,border-color .18s,transform .15s}
.tab:hover{border-color:var(--accent)}
.tab .t-day{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.15;white-space:nowrap}
.tab .t-sub{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] .t-sub{color:inherit;opacity:.78}
.tab.is-today::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.tab.leaders .t-day::after{content:"L";display:inline-grid;place-items:center;margin-left:6px;width:16px;height:16px;border-radius:4px;font:800 10px/1 var(--font-body);background:var(--sand);color:var(--sand-ink);vertical-align:2px}
.tab.drop-hot{outline:2px dashed var(--accent);outline-offset:2px;transform:translateY(-2px)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:14px 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;transition:opacity .15s,border-color .15s}
.chip .sw{width:12px;height:12px;border-radius:4px;background:oklch(var(--bk-bg-l) calc(var(--c) * var(--bk-chroma)) var(--h));border:1.5px solid oklch(var(--bk-bd-l) var(--c) var(--h))}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.legend.filtering .chip[aria-pressed="false"]{opacity:.55}
.tool-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Timetable (all days) */
.grid-wrap{overflow:auto;max-height:max(460px,calc(100dvh - 170px));border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:28px}
.grid{display:grid;grid-template-columns:var(--axis-w) repeat(var(--cols),minmax(var(--colw,132px),1fr));min-width:min-content}
.corner{position:sticky;left:0;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.col-head{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 10px 9px;border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.col-head:hover .ch-day{color:var(--accent)}
.col-head .ch-day{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.2}
.col-head .ch-sub{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.col-head.is-today .ch-day{color:var(--now)}
.axis{position:relative;background:var(--surface);border-right:1px solid var(--line)}
.grid .axis{position:sticky;left:0;z-index:2}
.axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.axis span.first{transform:translateY(2px)}
.lane{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:100% var(--hour);background-position:0 var(--off)}
.lane.leaders-day{background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px),repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in oklab,var(--sand) 12%,transparent) 10px 20px);background-size:100% var(--hour),auto;background-position:0 var(--off),0 0}
body.editing .lane{cursor:copy}
.now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:7;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}

/* Activity blocks */
.blk{position:absolute;z-index:1;overflow:hidden;border-radius:9px;padding:5px 8px;background:oklch(var(--bk-bg-l) calc(var(--c) * var(--bk-chroma)) var(--h));border:1px solid oklch(var(--bk-bd-l) var(--c) var(--h));color:oklch(var(--bk-tx-l) calc(var(--c) * 1.1) var(--h));font-size:12.5px;line-height:1.25;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s,opacity .2s}
.blk:hover{box-shadow:0 6px 16px -10px oklch(.25 .05 var(--h) / .7);z-index:2}
.blk:focus-visible{outline:2px solid var(--focus);outline-offset:1px;z-index:5}
.blk-in{display:flex;flex-direction:column;gap:2px;min-width:0;height:100%}
.blk-time{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.82;white-space:nowrap}
.blk-title{font-weight:750;font-weight:800;overflow-wrap:anywhere}
.blk-splits{display:flex;flex-direction:column;gap:1px;font-size:11.5px}
.blk-splits b{font-weight:800;margin-right:3px}
.blk-loc,.blk-notes{font-size:11.5px;opacity:.85}
.blk-notes{white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:1px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px;background:color-mix(in oklab,currentColor 13%,transparent)}
.blk.xs{padding:0 6px}
.blk.xs .blk-in{flex-direction:row;align-items:center;gap:6px;white-space:nowrap}
.blk.xs .blk-title{overflow:hidden;text-overflow:ellipsis;order:1;min-width:0}
.blk.xs .blk-time{order:2;font-weight:600;opacity:.7}
.blk.sm .blk-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk.dim{opacity:.22}
.blk.is-now{box-shadow:0 0 0 2px var(--now);z-index:3}
.blk.origin{opacity:.3;outline:2px dashed currentColor;outline-offset:-2px}
.blk-grip{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.blk-grip::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:.35}
.blk:hover .blk-grip::after{opacity:.7}
.ghost{position:fixed!important;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:0 22px 44px -14px rgba(0,0,0,.5);opacity:.97;transition:height .12s,width .12s}
.ghost-when{position:absolute;left:0;bottom:calc(100% + 6px);background:var(--ink);color:var(--bg);font:700 12px/1 var(--font-body);padding:6px 8px;border-radius:7px;white-space:nowrap}
.ghost.has-when{overflow:visible}
.drop-preview{position:absolute;left:3px;right:3px;z-index:6;border:2px dashed var(--accent);border-radius:9px;background:color-mix(in oklab,var(--accent) 12%,transparent);pointer-events:none;transition:top .07s ease-out}
html.dragging,html.dragging *{cursor:grabbing!important}

/* Day view */
.dv{max-width:900px;margin:0 auto 28px}
.dv-head{display:flex;align-items:flex-start;gap:12px;padding-block:6px 14px}
.dv-title{flex:1;min-width:0}
.dv-title .eyebrow{color:var(--ink-2);opacity:1}
.dv-title h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.4vw,38px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.dv-note{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
.dv-nav{display:flex;gap:6px;flex:none}
.dv-body{display:grid;grid-template-columns:var(--axis-w) minmax(0,1fr);border:1px solid var(--line);border-radius:16px;background:var(--surface);padding-block:12px;overflow:hidden;touch-action:pan-y}
.dv-body .lane{border-left:0;margin-right:10px}
.dv .blk{font-size:14px;padding:7px 12px;border-radius:11px}
.dv .blk-time{font-size:12px}
.dv .blk-splits,.dv .blk-loc,.dv .blk-notes{font-size:13px}
.dv .blk.xs{padding:0 10px}
.dv .blk.lg .blk-in{gap:4px}
.empty-day{position:absolute;inset:40px 12px auto;text-align:center;color:var(--ink-2);font-size:14px;pointer-events:none}
.anim-next{animation:slide-next .28s cubic-bezier(.2,.8,.2,1)}
.anim-prev{animation:slide-prev .28s cubic-bezier(.2,.8,.2,1)}
.anim-fade{animation:fade-in .22s ease-out}
@keyframes slide-next{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slide-prev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Edit dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 30px -20px rgba(0,0,0,.4);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-label{flex:none;font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.2;max-width:120px}
.tray{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding-block:2px;scrollbar-width:thin}
.tpl{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:7px 12px;border-radius:10px;background:oklch(var(--bk-bg-l) calc(var(--c) * var(--bk-chroma)) var(--h));border:1px solid oklch(var(--bk-bd-l) var(--c) var(--h));color:oklch(var(--bk-tx-l) calc(var(--c) * 1.1) var(--h));font-weight:800;font-size:13px;white-space:nowrap;cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tpl small{font-weight:600;font-size:11px;opacity:.8}
.tpl.blank{background:var(--surface-2);border:1px dashed var(--ink-2);color:var(--ink)}
.trash{display:none;flex:none;align-items:center;gap:8px;height:52px;padding:0 16px;border-radius:12px;border:2px dashed var(--danger);color:var(--danger);font-weight:800;font-size:13px}
html.dragging-existing .trash{display:flex}
.trash.hot{background:var(--danger);color:var(--surface);border-style:solid}
body.editing main{padding-bottom:96px}

/* Dialog / sheet */
dialog#dlg{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:18px;width:min(580px,calc(100vw - 32px));max-width:none;box-shadow:0 30px 80px -20px rgba(0,0,0,.55)}
dialog#dlg::backdrop{background:rgba(5,20,26,.5)}
dialog#dlg[open]{animation:dlg-in .22s cubic-bezier(.2,.8,.2,1)}
@keyframes dlg-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.sheet{display:flex;flex-direction:column;max-height:min(86dvh,860px);margin:0}
.sheet-h{display:flex;align-items:center;gap:12px;padding:18px 20px 10px}
.sheet-h h2{flex:1;margin:0;font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.15}
.sheet-b{overflow:auto;padding:6px 20px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.sheet-f .spacer{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2);min-width:0}
.fld em{font-style:normal;font-weight:500}
.fld input,.fld select,.fld textarea{font:400 16px/1.35 var(--font-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.sec+.sec{border-top:1px solid var(--line);padding-top:16px}
.sec h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:800}
.hint{margin:0;font-size:13px;color:var(--ink-2);font-weight:500}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.durs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.durs .pick{padding:0 12px}
.durs output{font-size:13px;font-weight:700;color:var(--ink-2);margin-left:4px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-height:32px}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.cat-row .fld input{min-height:40px}
.swatches{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:28px;height:28px;border-radius:8px;border:1.5px solid oklch(var(--bk-bd-l) var(--c) var(--h));background:oklch(var(--bk-bg-l) calc(var(--c) * var(--bk-chroma)) var(--h));padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.cat-item{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--bg)}
.detail-time{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.detail-list{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 14px;margin:0}
.detail-list dt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:2px}
.detail-list dd{margin:0;white-space:pre-line}
.copyable{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyable span{user-select:all}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;font-size:12px!important}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.day-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 12px}

/* Toast */

function dayMeta(d) { return state.days[d] || {}; }

}

/* ---------- history & drafts ---------- */
function snapshot() { return JSON.stringify(state); }
function commit(fn, opts) {
  var before = snapshot();
  fn();
  if (snapshot() === before) return false;
  hist.past.push(before); if (hist.past.length > 80) hist.past.shift();
  hist.future = [];
  markDirty();
  if (!opts || !opts.noRender) renderAll(opts && opts.flipFirst);
  return true;
}
function pushHistory(before) {
  if (before === snapshot()) return;
  hist.past.push(before); if (hist.past.length > 80) hist.past.shift(); hist.future = []; markDirty();
}
function markDirty() { ui.dirty = snapshot() !== publishedJSON; saveDraft(); }
function saveDraft() {
  if (snapshot() === publishedJSON) { store.del('bcp-draft'); return; }
  store.set('bcp-draft', { base: publishedRev, savedAt: Date.now(), state: state });
}
function resetToShared() {
  hist.past.push(snapshot()); hist.future = [];
  state = JSON.parse(publishedJSON); ui.dirty = false; store.del('bcp-draft');
  closeDialog(); renderAll();
  toast('Showing the shared program', { label: 'Undo', fn: undo });
}
function packState(s) {
  var json = JSON.stringify(s);
  if (typeof CompressionStream === 'undefined') return Promise.resolve(json);
  try {
    var stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(stream).arrayBuffer().then(function (buf) {
      var bytes = new Uint8Array(buf), bin = '';
      for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return 'CAMP1:' + btoa(bin);
    }).catch(function () { return json; });
  } catch (e) { return Promise.resolve(json); }
}
function unpackState(txt) {
  txt = (txt || '').trim();
  if (txt.indexOf('CAMP1:') !== 0) return Promise.resolve().then(function () { return JSON.parse(txt); });
  if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('unsupported'));
  return Promise.resolve().then(function () {
    var bin = atob(txt.slice(6).replace(/\s+/g, '')), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }).then(JSON.parse);
}
function undo() {
  if (!hist.past.length) return;
  hist.future.push(snapshot()); state = JSON.parse(hist.past.pop()); markDirty(); renderAll(); announce('Undone');
}
function redo() {
  if (!hist.future.length) return;
  hist.past.push(snapshot()); state = JSON.parse(hist.future.pop()); markDirty(); renderAll(); announce('Redone');
}

/* ---------- render: header ---------- */

  return fmtD(a, { weekday: 'short', day: 'numeric', month: sameMonth ? undefined : 'short' }).replace(',', '') + ' – ' + fmtD(b, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(',', '');
}

/* ---------- render: blocks ---------- */
function layoutDay(items) {
  var out = {}, cluster = [], cols = [], end = -1;
  function flush() { var n = cols.length; cluster.forEach(function (o) { o.n = n; out[o.id] = o; }); cluster = []; cols = []; end = -1; }
  items.forEach(function (it) {
    if (cluster.length && it.start >= end) flush();
    var c = -1;
    for (var i = 0; i < cols.length; i++) if (cols[i] <= it.start) { c = i; break; }
    if (c < 0) { c = cols.length; cols.push(it.end); } else cols[c] = it.end;
    cluster.push({ id: it.id, col: c }); end = Math.max(end, it.end);
  });
  flush();
  return out;
}
function isNow(it) { return it.date === todayISO() && nowMin() >= it.start && nowMin() < it.end; }
function blockHTML(it, L, ppm, a0, big) {
  var cat = catOf(it.cat);
  var top = (it.start - a0) * ppm, h = Math.max((it.end - it.start) * ppm, 16);
  var size = big ? (h < 54 ? 'xs' : h < 82 ? 'sm' : h < 130 ? 'md' : 'lg') : (h < 34 ? 'xs' : h < 62 ? 'sm' : h < 120 ? 'md' : 'lg');
  var n = L ? L.n : 1, col = L ? L.col : 0;
  var cls = 'blk ' + size + (ui.filter && ui.filter !== it.cat ? ' dim' : '') + (isNow(it) ? ' is-now' : '');
  var tags = [];
  if (it.leaders) tags.push('Leaders');
  if (it.weather) tags.push('Weather');
  if (it.optional) tags.push('Optional');
  var label = it.title + ', ' + dayShort(it.date) + ' ' + fmtRange(it.start, it.end) + (it.loc ? ', ' + it.loc : '') + (ui.editing ? '. Enter to edit, Alt+arrows to move' : '');
  var inner = '<span class="blk-time">' + esc(fmtRange(it.start, it.end)) + '</span><span class="blk-title">' + esc(it.title) + '</span>';
  if (size !== 'xs') {
    if (it.splits && it.splits.length && (size !== 'sm' || big)) inner += '<span class="blk-splits">' + it.splits.map(function (s) { return '<span><b>' + esc(s.g) + '</b>' + esc(s.t) + '</span>'; }).join('') + '</span>';
    if (it.loc && (size === 'md' || size === 'lg' || big)) inner += '<span class="blk-loc">' + esc(it.loc) + '</span>';
    if (big && size === 'lg' && it.notes) inner += '<span class="blk-notes">' + esc(it.notes) + '</span>';
    if (big && size === 'lg' && it.bring) inner += '<span class="blk-loc">Bring: ' + esc(it.bring) + '</span>';
    if (tags.length && (size === 'md' || size === 'lg')) inner += '<span class="tags">' + tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</span>';
  }
  return '<div class="' + cls + '" data-id="' + it.id + '" tabindex="0" role="button" aria-label="' + esc(label) + '" style="--h:' + cat.hue + ';--c:' + cat.c +
    ';top:' + (top + 1).toFixed(1) + 'px;height:' + (h - 2).toFixed(1) + 'px;left:calc(' + col + ' * 100% / ' + n + ' + 2px);width:calc(100% / ' + n + ' - 4px)"><div class="blk-in">' + inner + '</div>' +
    (ui.editing ? '<span class="blk-grip" aria-hidden="true"></span>' : '') + '</div>';
}
function laneHTML(date, ppm, a0, a1, big) {
  var items = visibleItems(date), L = layoutDay(items);
  var off = ((60 - (a0 % 60)) % 60) * ppm;
  var h = '<div class="lane' + (dayMeta(date).leaders ? ' leaders-day' : '') + '" data-lane="' + date + '" data-ppm="' + ppm + '" data-a0="' + a0 + '" data-a1="' + a1 + '" style="height:' + ((a1 - a0) * ppm).toFixed(1) + 'px;--hour:' + (60 * ppm) + 'px;--off:' + off.toFixed(1) + 'px">';
  items.forEach(function (it) { h += blockHTML(it, L[it.id], ppm, a0, big); });
  if (!items.length && big) h += '<p class="empty-day">' + (ui.editing ? 'Nothing planned yet. Tap a time to add an activity, or drag one up from the tray.' : 'Nothing planned for this day yet.') + '</p>';
  if (date === todayISO()) { var nm = nowMin(); if (nm >= a0 && nm <= a1) h += '<div class="now-line" style="top:' + ((nm - a0) * ppm).toFixed(1) + 'px"></div>'; }
  return h + '</div>';
}
function axisHTML(ppm, a0, a1) {
  var h = '<div class="axis" style="height:' + ((a1 - a0) * ppm).toFixed(1) + 'px" aria-hidden="true">';
  if (a0 % 60) h += '<span class="first" style="top:0">' + esc(fmtTime(a0)) + '</span>';
  for (var m = Math.ceil(a0 / 60) * 60; m < a1; m += 60) h += '<span' + (m === a0 ? ' class="first"' : '') + ' style="top:' + ((m - a0) * ppm).toFixed(1) + 'px">' + esc(fmtTime(m)) + '</span>';
  return h + '</div>';
}
function legendHTML() {

    return '<button class="chip" type="button" data-filter="' + c.id + '" aria-pressed="' + (ui.filter === c.id) + '" style="--h:' + c.hue + ';--c:' + c.c + '"><span class="sw"></span>' + esc(c.name) + '</button>';

/* ---------- render: dock ---------- */
function templates() {
  var seen = {}, out = [];
  state.items.forEach(function (it) {
    var k = it.title.toLowerCase() + '|' + it.cat;
    if (!seen[k]) { seen[k] = 1; out.push({ title: it.title, cat: it.cat, dur: it.end - it.start, loc: it.loc, splits: clone(it.splits || []), notes: it.notes, bring: it.bring, leaders: it.leaders, weather: it.weather, optional: it.optional }); }
  });
  var order = {}; state.cats.forEach(function (c, i) { order[c.id] = i; });
  out.sort(function (a, b) { return (order[a.cat] - order[b.cat]) || a.title.localeCompare(b.title); });
  out.unshift({ title: 'New activity', cat: (state.cats[0] || {}).id, dur: 60, blank: true, splits: [] });
  return out;
}

/* ---------- FLIP render ---------- */
function renderAll(flipFirst, anim) {
  var first = {};
  var focusedId = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('blk') ? document.activeElement.dataset.id : null;
  if (!reduceMotion) $$('#view .blk[data-id]').forEach(function (el) { first[el.dataset.id] = el.getBoundingClientRect(); });
  if (flipFirst) Object.keys(flipFirst).forEach(function (k) { first[k] = flipFirst[k]; });
  document.body.classList.toggle('editing', ui.editing);
  renderHeader(); renderTabs(); renderBanners(); renderView(anim); renderDock();
  if (focusedId) { var f = $('#view .blk[data-id="' + focusedId + '"]'); if (f) f.focus({ preventScroll: false }); }
  if (reduceMotion || anim) return;
  $$('#view .blk[data-id]').forEach(function (el) {
    var f = first[el.dataset.id], l = el.getBoundingClientRect();
    if (!f) { if (Object.keys(first).length) el.animate([{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' }); return; }
    var dx = f.left - l.left, dy = f.top - l.top, sx = f.width / (l.width || 1), sy = f.height / (l.height || 1);
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < .02 && Math.abs(sy - 1) < .02) return;
    if (Math.abs(dy) > 2000 || Math.abs(dx) > 2000) return;
    el.animate([{ transformOrigin: '0 0', transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')' }, { transformOrigin: '0 0', transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
}

/* ---------- navigation ---------- */
function setView(v, dir) {
  if (v === ui.view) return;
  var days = campDays();
  var anim = null;
  if (!reduceMotion) {
    if (v === 'overview' || ui.view === 'overview') anim = 'fade';
    else anim = dir || (days.indexOf(v) > days.indexOf(ui.view) ? 'next' : 'prev');
  }
  ui.view = v;
  try { location.replace('#' + (v === 'overview' ? 'overview' : 'day-' + v)); } catch (e) {}
  renderTabs(); renderView(anim);
  var v2 = $('#view'); if (anim === 'fade' && v2.firstElementChild) v2.firstElementChild.classList.add('anim-fade');

/* ---------- publishing ---------- */
function buildDocument(s) {

  return SKEL_OPEN + PAGE_HEAD + '<style id="app-style">' + STYLE_SRC + '</style>\n<div id="app"></div>\n' +
    '<' + SC + ' type="application/json" id="camp-data">' + data + '</' + SC + '>\n' +
    '<' + SC + ' id="app-js">' + JS_SRC + '</' + SC + '>\n' + SKEL_CLOSE;
}
function publish() {
  if (ui.publishing) return;
  if (!ui.canPublish || !artifactNS) { openSendChanges(); return; }
  var next = clone(state);
  next.rev = uid() + Date.now().toString(36); next.publishedAt = new Date().toISOString(); next.isExample = false;
  ui.publishing = true; renderHeader();
  sess.set('bcp-ui', { editing: ui.editing, view: ui.view, published: true });
  var draft = { base: publishedRev, savedAt: Date.now(), state: state };
  store.del('bcp-draft');
  var tries = 0;
  function attempt() {
    artifactNS.publish(buildDocument(next)).then(function () {
      toast('Published. Everyone with the link now sees this version.');
    }, function (err) {
      var code = err && err.code;
      if (code === 'conflict') { store.set('bcp-draft', draft); toast('Someone else published first. Loading their version; your changes are kept as a draft.'); return; }
      store.set('bcp-draft', draft); sess.del('bcp-ui');
      ui.publishing = false;
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled' || code === 'capability_removed' || code === 'not_declared') {
        ui.canPublish = false; ui.mode = 'local'; artifactNS = null; renderAll(); toast('You don’t have edit access to the shared page, so this is your own copy. Use Send changes to share it.');
      } else if (code === 'rate_limited') { renderHeader(); toast('Publishing is busy. Wait a minute, then publish again.'); }
      else if (code === 'too_large') { renderHeader(); toast('The program is too large to publish. Remove some long notes and try again.'); }
      else if ((code === 'upstream_error' || !code) && tries < 1) { tries++; ui.publishing = true; setTimeout(attempt, 700 + Math.random() * 900); }
      else { renderHeader(); toast('Publishing didn’t go through. Your changes are safe on this device; try again.'); }
    });
  }
  attempt();
}

/* ---------- capabilities ---------- */
function applyDraft() {
  var d = store.get('bcp-draft');

  } else ui.staleDraft = d;
}
function initCaps() {
  var C = window.claude;
  var flags = sess.get('bcp-ui'); sess.del('bcp-ui');
  function done(art) {
    ui.capsKnown = true;
    if (art) { ui.canPublish = true; ui.mode = 'artifact'; artifactNS = art; if (flags && flags.editing) ui.editing = true; }

    '<ol class="steps"><li>Copy your version below.</li><li>Send it to the organiser by text, email or chat.</li><li>They choose <b>Edit program</b>, then <b>Settings</b>, paste it under <b>Load changes someone sent you</b>, and publish.</li></ol>' +
    '<label class="fld">Your version<textarea id="x-data" class="mono" rows="4" readonly spellcheck="false">Preparing…</textarea></label>' +

/* ---------- drag & drop ---------- */

  var blk = e.target.closest('.blk');
  if (blk) { if (ui.editing) openItem(blk.dataset.id); else openDetails(blk.dataset.id); return; }
  var lane = e.target.closest('[data-lane]');
  if (lane && ui.editing) {
    var L = laneGeom(lane), st = clamp(Math.floor((L.a0 + (e.clientY - L.rect.top) / L.ppm) / 30) * 30, L.a0, L.a1 - 30);
    openItem(null, { date: L.date, start: st, end: Math.min(1440, st + 60) });
  }
});
app.addEventListener('keydown', function (e) {
  var blk = e.target.closest && e.target.closest('.blk');
  if (!blk) return;
  if (e.key === 'Enter' || (e.key === ' ' && !ui.editing)) { e.preventDefault(); if (ui.editing) openItem(blk.dataset.id); else openDetails(blk.dataset.id); return; }
  if (!ui.editing) return;
  var it = itemById(blk.dataset.id); if (!it) return;
  var snap = +state.settings.snap || 15, days = campDays();
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteItem(it.id); return; }
  if (!e.altKey) return;
  var dur = it.end - it.start, msg = null;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    var dir = e.key === 'ArrowUp' ? -1 : 1;
    if (e.shiftKey) { commit(function () { it.end = clamp(it.end + dir * snap, it.start + snap, 1440); }); msg = it.title + ' ' + fmtRange(it.start, it.end); }
    else { commit(function () { it.start = clamp(it.start + dir * snap, 0, 1440 - dur); it.end = it.start + dur; }); msg = it.title + ' ' + fmtRange(it.start, it.end); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    var j = days.indexOf(it.date) + (e.key === 'ArrowLeft' ? -1 : 1);
    if (j < 0 || j >= days.length) return;
    commit(function () { it.date = days[j]; });
    if (ui.view !== 'overview') { ui.view = it.date; renderAll(); var nb = $('#view .blk[data-id="' + it.id + '"]'); if (nb) nb.focus(); }
    msg = it.title + ' moved to ' + dayLong(it.date);
  }
  if (msg) announce(msg);
});
document.addEventListener('keydown', function (e) {
  if (!ui.editing || dlg.open) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
});

/* refresh the now-marker every minute */
setInterval(function () { if (!drag && !resize && !dlg.open && campDays().indexOf(todayISO()) >= 0) renderView(); }, 60000);

/* ---------- boot ---------- */
(function boot() {
  var flags = sess.get('bcp-ui');
  var fromHash = viewFromHash();
  var t = todayISO(), days = campDays();
  if (flags && flags.view && (flags.view === 'overview' || days.indexOf(flags.view) >= 0)) ui.view = flags.view;
  else if (fromHash) ui.view = fromHash;
  else if (days.indexOf(t) >= 0) ui.view = t;
  else ui.view = window.innerWidth <= 720 ? days[0] : 'overview';
  applyDraft();
  if (campDays().indexOf(ui.view) < 0 && ui.view !== 'overview') ui.view = 'overview';
  renderAll();
  initCaps();
})();
})();
</script>
