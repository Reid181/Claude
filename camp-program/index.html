<title>Beach Camp Program</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style id="app-style">
:root{
  /* Layout: full-height app shell. Top bar, filters and day strip stay put; one scroller holds the time grid
     (sticky day header + sticky time gutter) or the list. Editor = bottom sheet on phones, side panel on wide screens. */
  --bg:#EDF3F2; --surface:#FFFFFF; --surface-2:#E2EBEA; --ink:#0E2E36; --muted:#52707A;
  --line:#CBDAD9; --line-soft:#DFE8E7;
  --accent:#08756F; --accent-ink:#FFFFFF; --accent-soft:#D2ECE8;
  --flag-red:#D7262E; --flag-yellow:#FFC81E; --now:#D7262E; --on-now:#FFFFFF;
  --ok:#1C7A49; --warn:#9A5600;
  --scrim:rgb(9 30 36 / .4);
  --shadow:0 1px 2px rgb(14 46 54 / .08), 0 12px 32px rgb(14 46 54 / .16);
  --tint:24%; --tint-ink:46%;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:60px; --colmin:128px; --hour:76px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08161A; --surface:#0F2228; --surface-2:#173139; --ink:#E1EDEE; --muted:#8DA7AD;
    --line:#244149; --line-soft:#1A333B;
    --accent:#3AC2B6; --accent-ink:#03211E; --accent-soft:#103E3B;
    --flag-red:#E5484D; --flag-yellow:#FFD23F; --now:#FF5C61; --on-now:#FFFFFF;
    --ok:#4CC38A; --warn:#F0A848;
    --scrim:rgb(0 0 0 / .58);
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 14px 36px rgb(0 0 0 / .5);
    --tint:30%; --tint-ink:34%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08161A; --surface:#0F2228; --surface-2:#173139; --ink:#E1EDEE; --muted:#8DA7AD;
  --line:#244149; --line-soft:#1A333B;
  --accent:#3AC2B6; --accent-ink:#03211E; --accent-soft:#103E3B;
  --flag-red:#E5484D; --flag-yellow:#FFD23F; --now:#FF5C61; --on-now:#FFFFFF;
  --ok:#4CC38A; --warn:#F0A848;
  --scrim:rgb(0 0 0 / .58);
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 14px 36px rgb(0 0 0 / .5);
  --tint:30%; --tint-ink:34%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{flex:none;display:block}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.pad-x{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in oklab,var(--accent) 88%,var(--ink))}
.btn.danger{color:var(--flag-red)}
.btn.armed{background:var(--flag-red);color:#fff;border-color:transparent}
.btn.icon{width:36px;padding:0}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--flag-yellow);box-shadow:0 0 0 2px color-mix(in oklab,var(--flag-yellow) 35%,transparent)}
.linkbtn{border:0;background:none;padding:4px 2px;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 260px}
.flag{width:24px;height:24px;border-radius:5px;flex:none;background:linear-gradient(var(--flag-red) 50%,var(--flag-yellow) 50%);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.brand-text{min-width:0}
h1{font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.1;text-wrap:balance}
.sub{margin:3px 0 0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.sub .dates{color:var(--ink);font-weight:700}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,var(--surface))}
.pill.final{color:var(--ok);background:color-mix(in oklab,var(--ok) 14%,var(--surface))}
.top-actions{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;height:30px;padding:0 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;transition:background-color .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
@media (max-width:640px){
  .top-actions{width:100%}
  .top-actions .seg{flex:1}
  .seg button{flex:1}
  .hide-sm{display:none}
}

/* edit bar + banner */
.editbar{flex:none;background:var(--accent-soft);border-bottom:1px solid color-mix(in oklab,var(--accent) 28%,transparent)}
.eb-in{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding-block:8px}
.eb-label{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent)}
.eb-state{flex:1 1 160px;min-width:0;font-size:12.5px;color:var(--muted)}
.eb-state b{color:var(--ink)}
.eb-actions{display:flex;gap:6px;flex-wrap:wrap}
.eb-hint{flex-basis:100%;font-size:12px;color:var(--muted);margin:0}
@media (max-width:640px){.eb-hint{display:none}}
.banner{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding-block:8px;font-size:13px;background:color-mix(in oklab,var(--flag-yellow) 22%,var(--surface));border-bottom:1px solid color-mix(in oklab,var(--flag-yellow) 55%,transparent)}
.banner > span{flex:1 1 220px;min-width:0}

/* filters */
.filters{flex:none;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.f-row{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.f-row::-webkit-scrollbar{display:none}
.f-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;margin-right:2px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip[aria-checked="true"],.chip[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.f-sp{flex:1 0 8px}
.zoom{display:flex;gap:4px;flex:none}
.key{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.kchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;border:1px solid color-mix(in oklab,var(--c) 40%,var(--line));background:color-mix(in oklab,var(--c) 14%,var(--surface));font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink)}
.kchip i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.kchip[aria-pressed="false"]{opacity:.5;background:var(--surface);text-decoration:line-through}

/* day band (day view) */
.dayband{flex:none;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.daystrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:6px;scroll-snap-type:x proximity}
.daystrip::-webkit-scrollbar{display:none}
.dchip{position:relative;flex:none;display:grid;justify-items:center;min-width:54px;padding:6px 8px 7px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;scroll-snap-align:center;transition:background-color .2s,color .2s,border-color .2s}
.dchip .dow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dchip .dnum{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1}
.dchip .dmon{font-size:10.5px;color:var(--muted)}
.dchip[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dchip[aria-selected="true"] .dow,.dchip[aria-selected="true"] .dmon{color:inherit;opacity:.75}
.dchip.is-today::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.dayhead{display:flex;align-items:center;gap:8px;padding-top:2px;padding-bottom:10px}
.dh-text{flex:1;min-width:0;text-align:center}
.dh-text h2{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
.dh-text p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.nownext{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-bottom:10px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.nownext b{color:var(--now);text-transform:uppercase;font-size:11px;letter-spacing:.08em;margin-right:4px}

/* main scroller */
.main{flex:1;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}
.scroller:focus{outline:none}
.scroller.v-day{touch-action:pan-y;padding-top:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroller.v-week{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-padding-left:calc(var(--gut) + max(16px,env(safe-area-inset-left,0px)));scroll-snap-type:x proximity}
.scroller.v-list{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px}

/* time grid */
.grid{position:relative}
.g-head,.g-body{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(var(--colmin),1fr))}
.g-head{position:sticky;top:0;z-index:7;background:var(--bg);border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:2;background:var(--bg)}
.g-dh{appearance:none;border:0;border-left:1px solid var(--line-soft);background:transparent;color:var(--ink);padding:8px 6px 7px;display:grid;justify-items:center;cursor:pointer;scroll-snap-align:start;min-width:0}
.g-dh .dow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.g-dh .dnum{font-family:var(--f-display);font-size:21px;font-weight:700;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;transition:background-color .15s}
.g-dh:hover .dnum{background:var(--surface-2)}
.g-dh.is-today .dnum{background:var(--now);color:var(--on-now)}
.g-dh .dlab{font-size:11.5px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-body{position:relative;padding-bottom:28px}
.g-gutter{position:sticky;left:0;z-index:5;background:var(--bg)}
.g-hr{position:absolute;right:9px;transform:translateY(-50%);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1}
.g-hr.half{opacity:.55}
.g-hr.first{transform:none}
.g-col{position:relative;border-left:1px solid var(--line-soft);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line-soft) 1px,transparent 1px);
  background-size:100% var(--hour),100% calc(var(--hour) / 2);
  background-position:0 var(--off),0 var(--off2)}
.g-col.is-today{background-color:color-mix(in oklab,var(--now) 4%,transparent)}
.editing .g-col{cursor:cell}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:9;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}

/* activity blocks */
.ev{position:absolute;display:flex;flex-direction:column;gap:1px;padding:3px 7px 4px;border-radius:7px;overflow:hidden;cursor:pointer;font-size:12.5px;line-height:1.28;
  background:var(--surface-2);background:color-mix(in oklab,var(--c) var(--tint),var(--surface));
  color:var(--ink);color:color-mix(in oklab,var(--c) var(--tint-ink),var(--ink));
  border:1px solid color-mix(in oklab,var(--c) 42%,transparent);
  transition:box-shadow .15s,filter .15s}
.ev:hover{filter:saturate(1.15);box-shadow:0 2px 10px rgb(0 0 0 / .12);z-index:3}
.ev-time{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;opacity:.82;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-flags{display:inline-flex;gap:2px}
.ev-title{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,2);overflow-wrap:break-word;hyphens:auto}
.ev.split{font-size:11.5px;padding-left:5px;padding-right:4px}
.ev.split .ev-time{font-size:10.5px}
.ev-loc{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:0 4px;border-radius:4px;line-height:1.45;background:color-mix(in oklab,var(--c) 70%,var(--ink));color:var(--surface)}
.ev.sm{gap:0}
.ev.sm .ev-title{-webkit-line-clamp:1}
.ev.xs{flex-direction:row;align-items:center;gap:6px;padding-block:0;white-space:nowrap}
.ev.xs .ev-title{order:-1;-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.ev.xs .ev-time{font-size:10.5px}
.editing .ev .ev-time{padding-right:20px}
.editing .ev.xs{padding-right:26px}
.ev-grip{position:absolute;top:1px;right:1px;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;touch-action:none;cursor:grab;opacity:.7}
.ev-grip:hover{opacity:1;background:color-mix(in oklab,var(--c) 30%,transparent)}
.ev.xs .ev-grip{top:50%;transform:translateY(-50%);height:22px}
.ev-resize{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.ev-resize::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:.35}
.ev.is-dragging{z-index:20;box-shadow:var(--shadow);opacity:.96;transition:none;cursor:grabbing}
.ev.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.drag-tip{position:absolute;left:4px;bottom:calc(100% + 4px);background:var(--ink);color:var(--surface);font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none}
.ghost{position:absolute;left:3px;right:3px;display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:7px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;z-index:10;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

/* list view */
.list{max-width:780px;margin:0 auto}
.ls-day{padding-bottom:6px}
.ls-dh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 0 8px;background:var(--bg)}
.ls-dh > div{flex:1;min-width:0}
.ls-dh h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.2}
.ls-dh h2 .today{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-now);background:var(--now);padding:2px 7px;border-radius:99px;vertical-align:3px;margin-left:6px}
.ls-dh p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.ls-items{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.ls-ev{width:100%;display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:stretch;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.ls-time{padding-top:9px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
.ls-time small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ls-card{min-width:0;padding:8px 11px;border-radius:9px;background:color-mix(in oklab,var(--c) 15%,var(--surface));border:1px solid color-mix(in oklab,var(--c) 32%,transparent);display:grid;gap:2px;transition:background-color .15s}
.ls-ev:hover .ls-card{background:color-mix(in oklab,var(--c) 24%,var(--surface))}
.ls-title{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ls-title i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.ls-meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.ls-meta span{display:inline-flex;align-items:center;gap:4px}
.ls-empty{margin:0 0 6px 72px;color:var(--muted);font-size:13px}

/* empty state */
.empty{max-width:420px;margin:48px auto;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);font-size:19px;margin:0 0 6px}

/* fab */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 20px 0 16px;border:0;border-radius:25px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;box-shadow:var(--shadow);cursor:pointer}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:var(--shadow);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
.sheet-wrap.closing .scrim{animation:fade .16s reverse forwards}
.sheet-wrap.closing .sheet{animation:up .18s reverse forwards}
@media (min-width:900px){
  .sheet{left:auto;top:0;width:420px;max-height:none;border-radius:0;animation:side .28s cubic-bezier(.2,.8,.2,1)}
  .sheet::before{display:none}
  .sheet-wrap.closing .sheet{animation:side .18s reverse forwards}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes side{from{transform:translateX(100%)}to{transform:none}}
.sheet-head{flex:none;display:flex;align-items:center;gap:10px;padding-top:18px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.sheet-head h2{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.2;text-wrap:balance}
.sh-dot{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.sheet-body{flex:1;min-height:0;overflow:auto;display:grid;gap:16px;align-content:start;padding-top:16px;padding-bottom:20px}
.sheet-foot{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft)}
.sheet-foot .grow{flex:1}
.tabs{flex:none;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line-soft)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:10px 10px 9px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* form */
.field{display:grid;gap:6px;min-width:0}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.sheet input:not([type=checkbox]):not([type=radio]):not([type=color]),.sheet select,.sheet textarea{width:100%;min-width:0;min-height:42px;padding:9px 11px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px}
.sheet textarea{resize:vertical;line-height:1.45}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in oklab,var(--accent) 35%,transparent);outline-offset:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
@media (max-width:440px){.row3{grid-template-columns:1fr 1fr}.row3 > :first-child{grid-column:1 / -1}}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{position:relative;display:inline-flex}
.pick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pick span{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;pointer-events:none;transition:background-color .15s,border-color .15s}
.pick span i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.pick input:checked + span{background:color-mix(in oklab,var(--c,var(--accent)) 20%,var(--surface));border-color:var(--c,var(--accent));box-shadow:inset 0 0 0 1px var(--c,var(--accent))}
.pick input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.check input{width:19px;height:19px;margin:0;accent-color:var(--accent)}
.dur{font-size:12.5px;color:var(--muted)}
.copyto{border:1px solid var(--line);border-radius:10px;padding:0 12px}
.copyto summary{cursor:pointer;padding:11px 0;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
.copyto summary::-webkit-details-marker{display:none}
.copyto[open] summary{border-bottom:1px solid var(--line-soft)}
.daychecks{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0}
.daychecks label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer}
.daychecks input{margin:0;accent-color:var(--accent)}
.copyto .btn{margin-bottom:12px}
.sec{display:grid;gap:12px}
.sec + .sec{padding-top:16px;border-top:1px solid var(--line-soft)}
.sec h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700}
.dayrow{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.dr-date{font-size:12.5px;color:var(--muted);line-height:1.2}
.dr-date b{display:block;color:var(--ink);font-family:var(--f-display);font-size:15px}
.dr-actions{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
.dr-actions select{min-height:30px !important;height:30px;padding:0 8px !important;font-size:13px !important;width:auto !important;flex:1 1 140px}
@media (max-width:480px){.dayrow{grid-template-columns:62px 1fr}.dayrow > input:nth-of-type(2){grid-column:2}}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper output{font-family:var(--f-display);font-size:22px;font-weight:700;min-width:2ch;text-align:center}
.catrow,.grprow{display:grid;grid-template-columns:44px 1fr auto auto;gap:8px;align-items:center}
.grprow{grid-template-columns:1fr auto auto}
.catrow input[type=color]{width:44px;height:42px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.d-when{margin:0;font-size:16px;font-weight:700}
.d-list{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;margin:0}
.d-list dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.d-list dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.flagchips{display:flex;flex-wrap:wrap;gap:6px}
.flagchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2);font-weight:700;font-size:12.5px}
.info-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.keylist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.keylist li{display:flex;align-items:center;gap:10px}
.keylist i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.keylist span{flex:1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px !important}

/* toast */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:90;max-width:calc(100% - 32px);transform:translate(-50%,-16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:10px 15px;border-radius:11px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

    '<section class="sec"><h3>Program as text</h3><p class="hint">For a group chat, email or newsletter.' + filt + '</p>' +
    '<textarea id="s-text" class="mono" rows="7" readonly>' + esc(textProgram()) + '</textarea>' +
    '<div><button type="button" class="btn" data-sact="copy-text">' + ico('copy', 16) + 'Copy text</button></div></section>' +
    '<section class="sec"><h3>Backup</h3><p class="hint">Copy a backup code to keep a safe copy, or to start next year’s camp from this one in a new page.</p>' +
    '<div><button type="button" class="btn" data-sact="copy-backup">' + ico('copy', 16) + 'Copy backup code</button></div>' +
    field('Restore from a backup code', '<textarea id="s-restore" class="mono" rows="3" placeholder="Paste a backup code here"></textarea>', '', 's-restore') +
    '<div><button type="button" class="btn" data-sact="restore">Restore</button></div></section>' +
    '<section class="sec"><h3>Start over</h3><p class="hint">Removes every activity but keeps your days, types and groups. You can undo this.</p>' +
    '<div><button type="button" class="btn danger" data-sact="clear-all">' + ico('trash', 16) + 'Clear all activities</button></div></section>';
}

function arm(btn, label) {
  if (btn.dataset.armed === '1') { clearTimeout(btn._t); return true; }
  btn.dataset.armed = '1'; btn.dataset.orig = btn.innerHTML; btn.classList.add('armed'); btn.textContent = label;
  btn._t = setTimeout(function () { btn.dataset.armed = ''; btn.classList.remove('armed'); btn.innerHTML = btn.dataset.orig; }, 4000);
  return false;
}
function copyText(text, ta) {
  var ok = function () { toast('Copied'); };
  var fallback = function () { if (ta) { ta.focus(); ta.select(); toast('Selected. Press Copy on your device.'); } else toast('Couldn’t copy here'); };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}

sheet.addEventListener('input', function (e) {
  var t = e.target, sp = ui.sheet; if (!sp) return;
  if (t.dataset.efield) { updateEventField(t); return; }
  if (t.dataset.camp) { var k = t.dataset.camp; commit(function (s) { s.camp[k] = t.value; }, 'camp:' + k); return; }
  if (t.hasAttribute('data-sstart')) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.value)) return;
    commit(function (s) { s.camp.start = t.value; }, 'camp:start');
    sheet.querySelectorAll('[data-dr]').forEach(function (el) {
      var i = +el.dataset.dr, dt = dateOf(i), cnt = state.events.filter(function (x) { return x.day === i; }).length;
      el.innerHTML = '<b>' + DOW[dt.getDay()] + ' ' + dt.getDate() + '</b>' + MON[dt.getMonth()] + ' · ' + cnt;
    });
    return;
  }
  if (t.dataset.dfield) { var di = +t.dataset.day, f = t.dataset.dfield; commit(function (s) { s.days[di][f] = t.value; }, 'day:' + di + ':' + f); return; }
  if (t.dataset.cfield) {
    var cid = t.dataset.cat, cf = t.dataset.cfield;
    commit(function (s) { s.cats.forEach(function (c) { if (c.id === cid) c[cf] = t.value; }); }, 'cat:' + cid + ':' + cf, { flip: false });
    return;
  }
  if (t.dataset.gfield) { var gid = t.dataset.gid; commit(function (s) { s.groups.forEach(function (g) { if (g.id === gid) g.name = t.value; }); }, 'grp:' + gid); return; }
  if (t.dataset.setting) {
    var key = t.dataset.setting, val = key === 'clock' ? t.value : +t.value;
    commit(function (s) {
      s.settings[key] = val;
      if (s.settings.dayEnd <= s.settings.dayStart + 60) { if (key === 'dayStart') s.settings.dayEnd = Math.min(1440, s.settings.dayStart + 120); else s.settings.dayStart = Math.max(0, s.settings.dayEnd - 120); }
    }, null, { flip: false });
    sp.keepScroll = true; renderSheet(); scrollToStart();
    return;
  }
  if (t.dataset.copyday != null && t.value !== '') {
    var from = +t.dataset.copyday, to = +t.value, src = state.events.filter(function (x) { return x.day === from; });
    if (!src.length) { toast('Nothing to copy on ' + dayShort(from)); t.value = ''; return; }
    commit(function (s) { src.forEach(function (x) { var c = clone(x); c.id = uid(); c.day = to; s.events.push(c); }); });
    toast('Copied ' + src.length + ' activities to ' + dayShort(to));
    sp.keepScroll = true; renderSheet();
  }
});
function updateEventField(t) {
  var id = ui.sheet.id, f = t.dataset.efield, st = S();
  commit(function (s) {
    var ev = s.events.filter(function (x) { return x.id === id; })[0]; if (!ev) return;
    if (f === 'title' || f === 'loc' || f === 'notes') ev[f] = t.value;
    else if (f === 'cat') { ev.cat = t.value; lastCat = t.value; }
    else if (f === 'group') ev.group = t.value;
    else if (f === 'day') ev.day = +t.value;
    else if (f === 'start') { var dur = ev.end - ev.start; ev.start = +t.value; ev.end = Math.min(ev.start + dur, st.dayEnd); if (ev.end <= ev.start) ev.end = ev.start + st.step; }
    else if (f === 'end') ev.end = Math.max(+t.value, ev.start + 5);
    else if (f === 'weather' || f === 'offsite') ev[f] = t.checked;
  }, 'ev:' + id + ':' + f, { flip: f === 'day' || f === 'start' || f === 'end' });
  var ev2 = getEv(id); if (!ev2) return;
  if (f === 'start' || f === 'end') {
    var endSel = sheet.querySelector('#e-end');
    if (endSel) endSel.innerHTML = timeOptions(ev2.end, ev2.start + st.step, st.dayEnd, st.step);
    var dur2 = sheet.querySelector('#e-dur'); if (dur2) dur2.textContent = fmtDur(ev2.end - ev2.start);
  }
  if (f === 'cat') { var dot = sheet.querySelector('.sh-dot'); if (dot) dot.style.setProperty('--c', catOf(ev2.cat).color); }
  if (f === 'day') {
    if (ui.view === 'day' && ui.day !== ev2.day) { ui.day = ev2.day; renderDayband(); renderMain(); }
    var dc = sheet.querySelector('.daychecks');
    if (dc) dc.innerHTML = state.days.map(function (_, i) { return i === ev2.day ? '' : '<label><input type="checkbox" class="copyday" value="' + i + '">' + esc(dayShort(i)) + '</label>'; }).join('');
  }
}
sheet.addEventListener('click', function (e) {
  var sp = ui.sheet; if (!sp) return;
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  var tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { sp.tab = tabBtn.dataset.tab; renderSheet(); var nb = sheet.querySelector('[data-tab="' + sp.tab + '"]'); if (nb) nb.focus(); return; }
  var b = e.target.closest('[data-sact]'); if (!b) return;
  var act = b.dataset.sact;
  if (act === 'edit-this') { var id0 = sp.id; ui.sheet = null; openEditor(id0); return; }
  if (act === 'to-settings') { ui.sheet = null; openSettings('camp'); return; }
  if (act === 'duplicate') {
    var src = getEv(sp.id), copy = clone(src); copy.id = uid();
    var st = S(), dur = src.end - src.start;
    if (src.end + dur <= st.dayEnd) { copy.start = src.end; copy.end = src.end + dur; }
    commit(function (s) { s.events.push(copy); }, null, { focusId: copy.id, flash: true });
    ui.sheet = null; openEditor(copy.id); toast('Duplicated');
    return;
  }
  if (act === 'delete') {
    if (!arm(b, 'Delete this activity?')) return;
    var did = sp.id, title = getEv(did).title;
    commit(function (s) { s.events = s.events.filter(function (x) { return x.id !== did; }); });
    closeSheet(); toast('Deleted “' + title + '”. Undo is in the toolbar.');
    return;
  }
  if (act === 'copy-to') {
    var days = Array.prototype.map.call(sheet.querySelectorAll('.copyday:checked'), function (c) { return +c.value; });
    if (!days.length) { toast('Tick the days to copy to'); return; }
    var base = getEv(sp.id);
    commit(function (s) { days.forEach(function (d) { var c = clone(base); c.id = uid(); c.day = d; s.events.push(c); }); });
    sheet.querySelectorAll('.copyday:checked').forEach(function (c) { c.checked = false; });
    toast('Copied to ' + days.length + ' day' + (days.length > 1 ? 's' : ''));
    return;
  }
  if (act === 'day-add') { commit(function (s) { s.days.push({ label: s.days[s.days.length - 1].label, note: '' }); }); sp.keepScroll = true; renderSheet(); return; }
  if (act === 'day-before') {
    commit(function (s) { var d = parseISO(s.camp.start); d.setDate(d.getDate() - 1); s.camp.start = isoOf(d); s.days.unshift({ label: s.days[0].label, note: '' }); s.events.forEach(function (x) { x.day += 1; }); });
    ui.day += 1; sp.keepScroll = true; renderSheet(); return;
  }
  if (act === 'day-remove') {
    var last = state.days.length - 1, cnt = state.events.filter(function (x) { return x.day === last; }).length;
    if (cnt && !arm(b, 'Remove ' + dayShort(last) + ' and ' + cnt + ' activities?')) return;
    commit(function (s) { s.events = s.events.filter(function (x) { return x.day !== last; }); s.days.pop(); });
    sp.keepScroll = true; renderSheet(); return;
  }
  if (act === 'clear-day') {
    var cd = +b.dataset.day;
    if (!arm(b, 'Clear ' + dayShort(cd) + '?')) return;
    commit(function (s) { s.events = s.events.filter(function (x) { return x.day !== cd; }); });
    sp.keepScroll = true; renderSheet(); toast(dayShort(cd) + ' cleared'); return;
  }
  if (act === 'cat-add') {
    var used = state.cats.map(function (c) { return c.color.toLowerCase(); });
    var color = PALETTE.filter(function (p) { return used.indexOf(p.toLowerCase()) < 0; })[0] || PALETTE[state.cats.length % PALETTE.length];
    commit(function (s) { s.cats.push({ id: 'c' + uid().slice(1), name: 'New type', color: color }); });
    sp.keepScroll = true; renderSheet();
    var inputs = sheet.querySelectorAll('[data-cfield="name"]'); var li = inputs[inputs.length - 1]; if (li) { li.focus(); li.select(); }
    return;
  }
  if (act === 'cat-del') {
    var cid = b.dataset.cat, others = state.cats.filter(function (c) { return c.id !== cid; }), n2 = state.events.filter(function (x) { return x.cat === cid; }).length;
    if (!arm(b, n2 ? 'Move ' + n2 + ' to “' + others[0].name + '”?' : 'Delete?')) return;
    commit(function (s) { s.events.forEach(function (x) { if (x.cat === cid) x.cat = others[0].id; }); s.cats = s.cats.filter(function (c) { return c.id !== cid; }); });
    sp.keepScroll = true; renderSheet(); return;
  }
  if (act === 'grp-add') {
    commit(function (s) { s.groups.push({ id: 'g' + uid().slice(1), name: 'New group' }); });
    sp.keepScroll = true; renderSheet();
    var gi = sheet.querySelectorAll('[data-gfield]'); var lg = gi[gi.length - 1]; if (lg) { lg.focus(); lg.select(); }
    return;
  }
  if (act === 'grp-del') {
    var gid = b.dataset.gid, n3 = state.events.filter(function (x) { return x.group === gid; }).length;
    if (!arm(b, n3 ? n3 + ' become Everyone?' : 'Delete?')) return;
    commit(function (s) { s.events.forEach(function (x) { if (x.group === gid) x.group = 'all'; }); s.groups = s.groups.filter(function (g) { return g.id !== gid; }); });
    if (ui.group === gid) { ui.group = '__all'; savePrefs(); }
    sp.keepScroll = true; renderSheet(); renderFilters(); return;
  }
  if (act === 'copy-text') { var ta = sheet.querySelector('#s-text'); copyText(ta.value, ta); return; }
  if (act === 'copy-backup') { var code = JSON.stringify(state); var rt = sheet.querySelector('#s-restore'); copyText(code, null); if (rt && !rt.value) { rt.value = ''; } return; }
  if (act === 'restore') {
    var raw = (sheet.querySelector('#s-restore').value || '').trim(), parsed;
    try { parsed = JSON.parse(raw); } catch (er) { toast('That backup code isn’t complete. Copy it again and paste the whole thing.'); return; }
    if (!parsed || !Array.isArray(parsed.days) || !Array.isArray(parsed.events)) { toast('That doesn’t look like a camp program backup.'); return; }
    if (!arm(b, 'Replace this program?')) return;
    commit(function (s) { var n = normalize(parsed); n.meta = s.meta; Object.keys(s).forEach(function (k) { delete s[k]; }); Object.assign(s, n); });
    sp.keepScroll = true; renderSheet(); toast('Backup restored. Publish to share it.');
    return;
  }
  if (act === 'clear-all') {
    if (!arm(b, 'Clear all ' + state.events.length + ' activities?')) return;
    commit(function (s) { s.events = []; });
    sp.keepScroll = true; renderSheet(); toast('All activities cleared. Undo is in the toolbar.');
  }
});
sheetWrap.addEventListener('click', function (e) { if (e.target.classList.contains('scrim')) closeSheet(); });

/* ---------- live clock ---------- */
setInterval(function () {
  if (drag || todayIdx() == null) return;
  var st = S(), nm = nowMin(), hour = hourPx();
  scroller.querySelectorAll('.now').forEach(function (n) { n.style.top = ((nm - st.dayStart) / 60 * hour) + 'px'; });
  if (ui.view === 'day') renderDayband();

/* ---------- access + boot ---------- */
function resolveAccess() {
  if (location.protocol === 'file:') { canEdit = true; localPreview = true; afterAccess(); return; }
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  var safe = function (p) { return Promise.resolve(p).then(function (x) { return x; }, function () { return null; }); };
  Promise.all([safe(c.use('artifact')), safe(c.use('user'))]).then(function (r) {
    artifactApi = r[0];
    var usr = r[1];
    if (!r[0] || !usr) return false;
    return safe(usr.canEdit());
  }).then(function (ok) { canEdit = !!ok; afterAccess(); });
}
function afterAccess() {
  if (canEdit) {
    checkDraft();
    if (ui.wantEdit) ui.editing = true;
  }
  renderAll();
}
function start(data) {
  data = data || {};
  var sess = lsGet(SS, SESSION_KEY); lsDel(SS, SESSION_KEY);
  var src = (data && data.view) ? data : sess;
  var ti = todayIdx();
  ui.day = ti != null ? ti : 0;
  if (src) {
    if (['day','week','list'].indexOf(src.view) >= 0) ui.view = src.view;
    if (typeof src.day === 'number') ui.day = clamp(src.day, 0, state.days.length - 1);
    if (src.group) ui.group = src.group;
    if (src.editing) ui.wantEdit = true;
  }
  if (ui.group !== '__all' && !state.groups.some(function (g) { return g.id === ui.group; })) ui.group = '__all';
  renderAll();
  scrollToStart();
  resolveAccess();
}
try {
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { view: ui.view, day: ui.day, group: ui.group, editing: ui.editing }; });
  }
} catch (e) {}
var hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
